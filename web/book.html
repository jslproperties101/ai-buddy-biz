<!doctype html>
<!--
  Ai buddy Biz — online booking page.
    New booking:          book.html?k=<business online key>
    View / cancel booking: book.html?b=<booking token>   (sent in the confirmation message)
  Replace SUPABASE_URL and SUPABASE_ANON_KEY below.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book</title>
<style>
  :root { --fg:#111; --muted:#666; --bg:#fff; --card:#f5f6f6; --accent:#0f766e; --line:#ddd; --err:#b91c1c; --ok:#047857; }
  @media (prefers-color-scheme: dark) { :root { --fg:#eee; --muted:#aaa; --bg:#121212; --card:#1e2020; --accent:#2dd4bf; --line:#3a3a3a; --err:#f87171; --ok:#34d399; } }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 16px; line-height: 1.45; }
  main { max-width: 560px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .muted { color: var(--muted); font-size: 14px; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  button:disabled { opacity: .45; }
  input, select, textarea { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; margin: 4px 0 10px; }
  .choices { display: grid; gap: 8px; }
  .choice { text-align: left; background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
  .choice.on { border-color: var(--accent); outline: 2px solid var(--accent); }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; margin: 8px 0; }
  .slots button { padding: 8px 0; background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
  .slots button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .err { color: var(--err); } .ok { color: var(--ok); }
</style>
</head>
<body>
<main id="app"><p>Loading…</p></main>
<script>
  const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR-ANON-KEY";
  const q = new URLSearchParams(location.search);
  const key = q.get("k") || "", btok = q.get("b") || "";
  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  async function rpc(name, body) {
    const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
      method: "POST", headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify(body),
    });
    const data = await r.json().catch(() => null);
    if (!r.ok) throw new Error((data && data.message) || "Something went wrong — please try again");
    return data;
  }

  async function showBooking() {
    let b;
    try { b = await rpc("public_booking", { p_token: btok }); } catch (e) { app.innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
    if (!b) { app.innerHTML = `<div class="card"><h2>Booking not found</h2></div>`; return; }
    const label = { pending: "Requested", confirmed: "Confirmed", arrived: "Checked in", completed: "Completed", no_show: "Missed", cancelled: "Cancelled" }[b.status] || b.status;
    app.innerHTML = `<div class="card"><div class="muted">${esc(b.business)}</div><h2 style="margin:4px 0">${esc(b.service || "Table for " + b.party_size)}</h2>
      <p><strong>${esc(b.start)}</strong>${b.with ? " with " + esc(b.with) : ""}</p><p>Status: <strong>${esc(label)}</strong></p>
      ${b.can_cancel ? `<button class="ghost" id="cancel">Cancel this booking</button>` : b.status === "confirmed" ? `<p class="muted">To change it now, please call us.</p>` : ""}
      <p id="msg"></p></div>`;
    const c = document.getElementById("cancel");
    if (c) c.onclick = async () => {
      if (!confirm("Cancel this booking?")) return;
      c.disabled = true;
      try { await rpc("public_cancel_booking", { p_token: btok }); showBooking(); }
      catch (e) { document.getElementById("msg").innerHTML = `<span class="err">${esc(e.message)}</span>`; c.disabled = false; }
    };
  }

  async function showNew() {
    let O;
    try { O = await rpc("public_booking_options", { p_key: key }); } catch (e) { app.innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
    document.title = "Book · " + O.business;
    const money = (n) => (O.currency === "MYR" ? "RM" : O.currency + " ") + Number(n).toFixed(2);
    const S = { service: null, table: false, party: 2, date: iso(new Date()), time: null };
    if (!O.services.length && O.tables) S.table = true;
    const max = new Date(Date.now() + O.days_ahead * 86400000);

    async function render() {
      const what = S.table ? null : S.service;
      app.innerHTML = `<div class="card"><h2 style="margin:0">${esc(O.business)}</h2><div class="muted">${esc(O.outlet)}</div></div>
        <div class="card"><strong>What would you like to book?</strong><div class="choices" style="margin-top:8px">
          ${O.tables ? `<button class="choice ${S.table ? "on" : ""}" data-table="1">A table</button>` : ""}
          ${O.services.map((s) => `<button class="choice ${S.service === s.id && !S.table ? "on" : ""}" data-svc="${s.id}">
              <strong>${esc(s.name)}</strong> <span class="muted">· ${s.minutes} min${Number(s.price) > 0 ? " · " + money(s.price) : ""}</span>
              ${s.description ? `<br><span class="muted">${esc(s.description)}</span>` : ""}</button>`).join("")}
        </div></div>
        ${S.table || S.service ? `<div class="card">
          ${S.table ? `<label>How many people?<select id="party">${Array.from({ length: O.max_party }, (_, i) => `<option ${i + 1 === S.party ? "selected" : ""}>${i + 1}</option>`).join("")}</select></label>` : ""}
          <label>Date<input type="date" id="date" value="${S.date}" min="${iso(new Date())}" max="${iso(max)}"></label>
          <div id="slots" class="slots"><span class="muted">Loading times…</span></div></div>` : ""}
        ${S.time ? `<div class="card"><strong>Your details</strong>
          <label>Name<input id="name" maxlength="80" autocomplete="name"></label>
          <label>Phone<input id="phone" type="tel" autocomplete="tel"></label>
          <label>Email (optional)<input id="email" type="email" autocomplete="email"></label>
          <label>Anything we should know? (optional)<textarea id="notes" rows="2" maxlength="500"></textarea></label>
          <p class="err" id="err"></p>
          <button id="book" style="width:100%">Book ${esc(S.date)} at ${esc(S.time)}</button></div>` : ""}`;
      app.querySelectorAll("[data-svc]").forEach((b) => b.onclick = () => { S.service = b.dataset.svc; S.table = false; S.time = null; render(); });
      app.querySelectorAll("[data-table]").forEach((b) => b.onclick = () => { S.table = true; S.service = null; S.time = null; render(); });
      const p = document.getElementById("party"); if (p) p.onchange = () => { S.party = +p.value; S.time = null; render(); };
      const d = document.getElementById("date"); if (d) d.onchange = () => { S.date = d.value; S.time = null; render(); };
      const bk = document.getElementById("book"); if (bk) bk.onclick = book;
      if (S.table || S.service) {
        const box = document.getElementById("slots");
        try {
          const slots = await rpc("public_booking_slots", { p_key: key, p_date: S.date, p_service: S.table ? null : S.service, p_party: S.party });
          box.innerHTML = slots.length ? slots.map((t) => `<button class="${t === S.time ? "on" : ""}" data-t="${t}">${t}</button>`).join("")
                                       : `<span class="muted">No free times on this day — try another date.</span>`;
          box.querySelectorAll("[data-t]").forEach((b) => b.onclick = () => { S.time = b.dataset.t; render(); });
        } catch (e) { box.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
      }
    }

    async function book() {
      const v = (id) => document.getElementById(id).value.trim();
      const err = document.getElementById("err"), btn = document.getElementById("book");
      if (v("name").length < 2) return (err.textContent = "Please enter your name.");
      if (v("phone").replace(/\D/g, "").length < 9) return (err.textContent = "Please enter your phone number.");
      btn.disabled = true; btn.textContent = "Booking…";
      try {
        const r = await rpc("public_book", { p_key: key, p_date: S.date, p_time: S.time, p_service: S.table ? null : S.service,
          p_party: S.table ? S.party : 1, p_name: v("name"), p_phone: v("phone"), p_email: v("email") || null, p_notes: v("notes") || null });
        location.href = "book.html?b=" + encodeURIComponent(r.token);
      } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = "Try again"; }
    }
    render();
  }

  if (btok) showBooking(); else showNew();
</script>
</body>
</html>
