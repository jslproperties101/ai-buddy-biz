<!doctype html>
<!--
  Ai buddy Biz — order tracking page for customers: order.html?o=<tracking token>
  Replace SUPABASE_URL and SUPABASE_ANON_KEY below. Refreshes itself every 20 seconds.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your order</title>
<style>
  :root { --fg:#111; --muted:#666; --bg:#fff; --card:#f5f6f6; --accent:#0f766e; --line:#ddd; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --fg:#eee; --muted:#aaa; --bg:#121212; --card:#1e2020; --accent:#2dd4bf; --line:#3a3a3a; --err:#f87171; } }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 16px; line-height: 1.45; }
  main { max-width: 560px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .muted { color: var(--muted); font-size: 14px; }
  .big { font-size: 26px; font-weight: 700; margin: 4px 0; }
  ol.steps { list-style: none; padding: 0; margin: 8px 0 0; }
  ol.steps li { padding: 6px 0 6px 28px; position: relative; color: var(--muted); }
  ol.steps li::before { content: ""; position: absolute; left: 6px; top: 12px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); }
  ol.steps li.done { color: var(--fg); } ol.steps li.done::before { background: var(--accent); border-color: var(--accent); }
  .line { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; }
  .err { color: var(--err); }
</style>
</head>
<body>
<main id="app"><p>Loading…</p></main>
<script>
  const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR-ANON-KEY";
  const token = new URLSearchParams(location.search).get("o") || "";
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const t = (v) => v ? new Date(v).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : "";
  let timer;

  async function load() {
    let o;
    try {
      const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/public_order", {
        method: "POST", headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
        body: JSON.stringify({ p_token: token }),
      });
      o = await r.json();
      if (!r.ok) throw new Error(o?.message || "Could not load");
    } catch (e) { document.getElementById("app").innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
    if (!o) { document.getElementById("app").innerHTML = `<div class="card"><h2>Order not found</h2><p class="muted">Check the link you were sent.</p></div>`; return; }
    const money = (n) => (o.currency === "MYR" ? "RM" : o.currency + " ") + Number(n).toFixed(2);
    const delivery = o.fulfilment === "delivery" || o.fulfilment === "shipping";
    const steps = [
      ["Order received", o.created_at, true],
      ["Accepted", o.accepted_at, !!o.accepted_at],
      [o.fulfilment === "here" ? "Being prepared" : "Ready" + (delivery ? " to go" : " for pickup"), o.ready_at, !!o.ready_at],
      ...(delivery ? [["On the way", o.dispatched_at, !!o.dispatched_at], ["Delivered", o.delivered_at, !!o.delivered_at]] : []),
      ["Completed", o.completed_at, !!o.completed_at],
    ];
    const headline = {
      pending: "Waiting for the shop to accept", open: o.fulfilment === "here" ? "Your food is being prepared" : "Being prepared",
      ready: delivery ? "Ready — waiting for the rider" : "Ready for pickup!", out_for_delivery: "On the way to you",
      delivered: "Delivered — enjoy!", completed: "Thank you!", cancelled: "Order cancelled",
    }[o.status] || o.status;
    const svc = Number(o.items_total) * Number(o.service_charge_pct) / 100;
    document.title = `${o.business} ${o.order_no}`;
    document.getElementById("app").innerHTML = `
      <div class="card"><div class="muted">${esc(o.business)}${o.table ? " · Table " + esc(o.table) : ""}</div>
        <div class="big">Order ${esc(o.order_no)}</div><div><strong>${esc(headline)}</strong></div>
        ${o.status === "cancelled" ? `<p class="err">${esc(o.cancel_reason || "")}</p>` :
          `<ol class="steps">${steps.map(([label, at, done]) => `<li class="${done ? "done" : ""}">${esc(label)} <span class="muted">${t(at)}</span></li>`).join("")}</ol>`}
        ${o.scheduled_for ? `<p class="muted">Scheduled for ${new Date(o.scheduled_for).toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" })}</p>` :
          (o.status === "open" || o.status === "pending") && o.fulfilment !== "here" ? `<p class="muted">Usually ready in about ${o.prep_minutes} minutes.</p>` : ""}
      </div>
      <div class="card">
        ${o.items.map((i) => `<div class="line"><span>${Number(i.qty)}× ${esc(i.name)}${i.options ? `<br><span class="muted">${esc(i.options)}</span>` : ""}</span><span>${money(i.qty * i.price)}</span></div>`).join("")}
        <div class="line" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><span>Items</span><span>${money(o.items_total)}</span></div>
        ${svc > 0 ? `<div class="line muted"><span>Service charge</span><span>${money(svc)}</span></div>` : ""}
        ${Number(o.delivery_fee) > 0 ? `<div class="line muted"><span>Delivery</span><span>${money(o.delivery_fee)}</span></div>` : ""}
        <p class="muted">Tax, if any, appears on your receipt.</p>
      </div>
      ${o.fulfilment === "here" && !["completed", "cancelled"].includes(o.status) ? `<p class="muted">Want more? Scan the QR code on your table again.</p>` : ""}`;
    clearTimeout(timer);
    if (!["completed", "cancelled", "delivered"].includes(o.status)) timer = setTimeout(load, 20000);
  }
  load();
</script>
</body>
</html>
