<!doctype html>
<!--
  Ai buddy Biz — public shipment tracking page.
  Host this file anywhere (e.g. https://track.yourcompany.com/) and set the app's TRACK_URL to that address.
  Replace SUPABASE_URL and SUPABASE_ANON_KEY below. Customers open  ...?t=<tracking code>
  Shows status and milestones only — never prices, parties or internal notes.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track shipment</title>
<style>
  :root { --fg:#111; --muted:#666; --bg:#fff; --card:#f6f7f7; --accent:#0f766e; --line:#ddd; }
  @media (prefers-color-scheme: dark) { :root { --fg:#eee; --muted:#aaa; --bg:#121212; --card:#1d1f1f; --accent:#2dd4bf; --line:#333; } }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 16px; }
  main { max-width: 560px; margin: 0 auto; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input { flex: 1; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; min-width: 0; }
  button { font: inherit; padding: 10px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .route { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; }
  .status { font-size: 1.5rem; font-weight: 700; color: var(--accent); margin: 4px 0; }
  .muted { color: var(--muted); font-size: 14px; }
  ol { list-style: none; padding: 0; margin: 0; border-left: 2px solid var(--line); }
  li { position: relative; padding: 0 0 16px 16px; }
  li::before { content: ""; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
  li.exception::before { background: #dc2626; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h2 id="biz">Track your shipment</h2>
  <form id="f"><input id="t" placeholder="Tracking code" autocomplete="off"><button>Track</button></form>
  <div id="out" role="status"></div>
</main>
<script>
  const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR-ANON-KEY";

  const labels = { booked:"Booked", picked_up:"Picked up", at_origin:"At origin", departed:"Departed", in_transit:"In transit",
    transshipment:"Transshipment", arrived:"Arrived", customs:"With customs", released:"Released by customs",
    out_for_delivery:"Out for delivery", delivered:"Delivered", exception:"Delay / problem", note:"Update" };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const when = (v) => v ? new Date(v).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "—";
  const out = document.getElementById("out"), input = document.getElementById("t");

  async function track(token) {
    out.textContent = "Looking up…";
    try {
      const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/track_shipment", {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
        body: JSON.stringify({ p_token: token.trim() }),
      });
      const s = await r.json();
      if (!r.ok || !s) { out.innerHTML = '<div class="card">No shipment found for that code.</div>'; return; }
      document.getElementById("biz").textContent = (s.business || "") + " — shipment " + s.ref;
      out.innerHTML = `
        <div class="card">
          <div class="route"><span>${esc(s.origin)}</span><span>→</span><span>${esc(s.destination)}</span></div>
          <div class="status">${esc(labels[s.status] || s.status.replace(/_/g, " "))}</div>
          <div class="grid">
            <span class="muted">Departure</span><span>${s.atd ? when(s.atd) : "Planned " + when(s.etd)}</span>
            <span class="muted">Arrival</span><span>${s.ata ? when(s.ata) : "Expected " + when(s.eta)}</span>
            ${s.delivered_at ? `<span class="muted">Delivered</span><span>${when(s.delivered_at)}</span>` : ""}
            <span class="muted">Packages</span><span>${esc(s.packages)} · ${esc(s.weight_kg)} kg</span>
          </div>
        </div>
        <div class="card"><ol>${(s.events || []).map(e => `
          <li class="${e.code === "exception" ? "exception" : ""}"><strong>${esc(labels[e.code] || e.code)}</strong>
          ${e.location ? " — " + esc(e.location) : ""}<div class="muted">${when(e.at)}</div>
          ${e.note ? `<div>${esc(e.note)}</div>` : ""}</li>`).join("") || "<li>No updates yet</li>"}</ol></div>`;
    } catch (err) { out.textContent = "Couldn't reach the tracking service. Please try again."; }
  }

  document.getElementById("f").addEventListener("submit", (e) => { e.preventDefault(); if (input.value) { history.replaceState(null, "", "?t=" + encodeURIComponent(input.value.trim())); track(input.value); } });
  const t = new URLSearchParams(location.search).get("t");
  if (t) { input.value = t; track(t); }
</script>
</body>
</html>
