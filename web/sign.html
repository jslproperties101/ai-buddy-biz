<!doctype html>
<!--
  Ai buddy Biz — document signing & verification page.
  Host anywhere (e.g. https://sign.yourcompany.com/) and set the app's SIGN_URL to that address.
  Replace SUPABASE_URL and SUPABASE_ANON_KEY below.
    Sign:   ...?t=<signing link token>
    Verify: ...?verify=<64-character document fingerprint printed on the signed PDF>
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign document</title>
<style>
  :root { --fg:#111; --muted:#666; --bg:#fff; --card:#f6f7f7; --accent:#0f766e; --line:#ccc; --err:#b91c1c; --ok:#047857; }
  @media (prefers-color-scheme: dark) { :root { --fg:#eee; --muted:#aaa; --bg:#121212; --card:#1d1f1f; --accent:#2dd4bf; --line:#444; --err:#f87171; --ok:#34d399; } }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 16px; line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .muted { color: var(--muted); font-size: 14px; }
  .doc { white-space: pre-wrap; font-family: Georgia, serif; font-size: 15px; max-height: 60vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 16px; background: var(--bg); }
  input[type=text] { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; }
  canvas { width: 100%; height: 160px; border: 1px dashed var(--line); border-radius: 8px; background: #fff; touch-action: none; display: block; }
  button { font: inherit; padding: 12px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; margin: 12px 0; }
  .err { color: var(--err); } .ok { color: var(--ok); }
  ul.signers { list-style: none; padding: 0; margin: 8px 0 0; }
  ul.signers li { padding: 2px 0; font-size: 14px; }
  code { word-break: break-all; font-size: 12px; }
</style>
</head>
<body>
<main id="app"><p>Loading…</p></main>
<script>
  const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR-ANON-KEY";

  const app = document.getElementById("app");
  const q = new URLSearchParams(location.search);
  const token = q.get("t"), verifyHash = q.get("verify");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const when = (v) => v ? new Date(v).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "";

  async function rpc(name, body) {
    const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify(body),
    });
    const data = await r.json().catch(() => null);
    if (!r.ok) throw new Error((data && data.message) || "Something went wrong");
    return data;
  }

  function signerList(signers) {
    return '<ul class="signers">' + signers.map(s =>
      `<li>${s.status === "signed" ? "✅" : s.status === "declined" ? "❌" : "⏳"} ${esc(s.name)} <span class="muted">(${esc(s.role)}${s.signed_at ? ", signed " + when(s.signed_at) : ""})</span></li>`).join("") + "</ul>";
  }

  async function showVerify(hash) {
    try {
      const v = await rpc("verify_document", { p_hash: hash.trim().toLowerCase() });
      app.innerHTML = v.found
        ? `<div class="card"><h2 class="ok">✔ Document found</h2>
           <p><strong>${esc(v.title)}</strong> (${esc(v.number)}) from ${esc(v.business)}</p>
           <p>Status: ${esc(v.status)}${v.signed_at ? " · completed " + when(v.signed_at) : ""}</p>
           ${signerList((v.signers || []).map(s => ({ ...s, status: "signed" })))}
           <p class="muted">The fingerprint matches the text that was signed. Any change to the wording would give a different fingerprint.</p></div>`
        : `<div class="card"><h2 class="err">No match</h2><p>No signed document has this fingerprint. The copy you have may have been changed, or the fingerprint was mistyped.</p></div>`;
    } catch (e) { app.innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
  }

  async function showSign() {
    let d;
    try { d = await rpc("get_signing_doc", { p_token: token }); }
    catch (e) { app.innerHTML = `<div class="card"><h2>Link not valid</h2><p>${esc(e.message)}</p></div>`; return; }
    document.title = "Sign: " + d.title;
    const me = d.signer;
    const done = me.status === "signed" || me.status === "declined";
    app.innerHTML = `
      <div class="card">
        <div class="muted">${esc(d.business)} · ${esc(d.number)}</div>
        <h2 style="margin:4px 0">${esc(d.title)}</h2>
        <div class="muted">For ${esc(me.name)} (${esc(me.role)})</div>
        ${signerList(d.signers)}
      </div>
      <div class="doc" id="doc">${esc(d.body)}</div>
      <p class="muted">Document fingerprint (SHA-256): <code>${esc(d.hash)}</code></p>
      <div class="card" id="action"></div>`;
    const action = document.getElementById("action");
    if (me.status === "signed") { action.innerHTML = `<p class="ok">✔ You signed this on ${when(me.signed_at)}. Thank you.</p>`; return; }
    if (me.status === "declined") { action.innerHTML = `<p>You declined to sign this document.</p>`; return; }
    if (d.blocked) { action.innerHTML = `<p>${esc(d.blocked)}. You'll be able to sign once they have.</p>`; return; }

    action.innerHTML = `
      <label>Type your full name<br><input type="text" id="name" value="${esc(me.name)}" autocomplete="name"></label>
      <p style="margin:12px 0 4px">Draw your signature</p>
      <canvas id="pad"></canvas>
      <div class="row" style="margin-top:6px"><button class="secondary" id="clear" type="button">Clear</button></div>
      ${me.require_code ? `<p style="margin:12px 0 4px">Enter the 6-digit code we send you</p>
        <div class="row"><input type="text" id="code" inputmode="numeric" maxlength="6" style="max-width:140px">
        <button class="secondary" id="sendcode" type="button">Send code</button></div>` : ""}
      <label class="check"><input type="checkbox" id="consent">
        <span>I have read this document and agree to sign it electronically. I understand my electronic signature is as binding as a handwritten one.</span></label>
      <div class="row"><button id="sign">Sign document</button><button class="secondary" id="decline" type="button">Decline</button></div>
      <p id="msg" role="status"></p>`;

    const pad = document.getElementById("pad"), ctx = pad.getContext("2d");
    let drawing = false, drawn = false;
    function resize() { const r = pad.getBoundingClientRect(); pad.width = r.width * devicePixelRatio; pad.height = r.height * devicePixelRatio;
      ctx.scale(devicePixelRatio, devicePixelRatio); ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.strokeStyle = "#111"; drawn = false; }
    resize();
    const pos = (e) => { const r = pad.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    pad.addEventListener("pointerdown", (e) => { drawing = true; pad.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); });
    pad.addEventListener("pointermove", (e) => { if (!drawing) return; ctx.lineTo(...pos(e)); ctx.stroke(); drawn = true; });
    ["pointerup", "pointercancel"].forEach(t => pad.addEventListener(t, () => drawing = false));
    document.getElementById("clear").onclick = () => { ctx.clearRect(0, 0, pad.width, pad.height); drawn = false; };
    const msg = document.getElementById("msg");
    const say = (t, cls) => { msg.className = cls || ""; msg.textContent = t; };

    const sendBtn = document.getElementById("sendcode");
    if (sendBtn) sendBtn.onclick = async () => {
      sendBtn.disabled = true;
      try { const via = await rpc("request_sign_code", { p_token: token }); say("Code sent to your " + via + ". It expires in 10 minutes."); }
      catch (e) { say(e.message, "err"); }
      setTimeout(() => sendBtn.disabled = false, 60000);
    };

    document.getElementById("sign").onclick = async () => {
      const name = document.getElementById("name").value.trim();
      if (name.length < 2) return say("Type your full name.", "err");
      if (!drawn) return say("Please draw your signature.", "err");
      if (!document.getElementById("consent").checked) return say("Please tick the box to agree.", "err");
      const codeEl = document.getElementById("code");
      if (codeEl && !/^\d{6}$/.test(codeEl.value)) return say("Enter the 6-digit code.", "err");
      const btn = document.getElementById("sign"); btn.disabled = true; say("Signing…");
      try {
        const r = await rpc("sign_document", { p_token: token, p_signed_name: name, p_signature: pad.toDataURL("image/png"), p_consent: true, p_code: codeEl ? codeEl.value : null });
        if (!r.ok) { btn.disabled = false; return say(r.error, "err"); }
        action.innerHTML = `<p class="ok">✔ Signed. ${r.completed ? "Everyone has now signed — the sender will share the final copy." : "We'll let the other signers know."}</p>`;
      } catch (e) { btn.disabled = false; say(e.message, "err"); }
    };

    document.getElementById("decline").onclick = async () => {
      const reason = prompt("Why are you declining? (optional)") ?? null;
      if (reason === null) return;
      try { await rpc("decline_document", { p_token: token, p_reason: reason }); action.innerHTML = "<p>You declined to sign. The sender has been told.</p>"; }
      catch (e) { say(e.message, "err"); }
    };
  }

  if (verifyHash) showVerify(verifyHash);
  else if (token) showSign();
  else {
    app.innerHTML = `<div class="card"><h2>Check a signed document</h2>
      <p>Enter the fingerprint printed at the bottom of the signed PDF.</p>
      <form id="vf" class="row"><input type="text" id="vh" placeholder="64-character fingerprint" style="flex:1"><button>Check</button></form></div>`;
    document.getElementById("vf").onsubmit = (e) => { e.preventDefault(); showVerify(document.getElementById("vh").value); };
  }
</script>
</body>
</html>
