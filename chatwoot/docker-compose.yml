# Chatwoot self-host stack for Ai buddy Biz (Phase 1: deploy package).
# NOT yet run against a real server — see chatwoot/README.md for the first-boot checklist.
#
# Services: rails (web), sidekiq (background jobs), postgres (pgvector), redis, caddy (HTTPS reverse proxy).
# Only caddy publishes ports (80/443). Postgres and Redis are NOT exposed to the internet.

services:
  rails:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file: .env
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    volumes:
      - ./data/storage:/app/storage
    expose:
      - "3000"

  sidekiq:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file: .env
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - ./data/storage:/app/storage

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - rails
    ports:
      - "80:80"
      - "443:443"
    environment:
      CHATWOOT_DOMAIN: ${CHATWOOT_DOMAIN:?set CHATWOOT_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres:
  redis:
  caddy_data:
  caddy_config:
