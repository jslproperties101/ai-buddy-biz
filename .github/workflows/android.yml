name: Android APK

# Builds the Ai buddy Biz APK on every push to main and publishes it on a
# per-batch GitHub Release, so each batch has its own download link:
#   https://github.com/jslproperties101/ai-buddy-biz/releases/download/batch-<x>/ai-buddy-biz-batch-<x>.apk
#
# Database (Settings → Secrets and variables → Actions):
#   Since Batch 2b (9 Nov 2026) Ai buddy Biz uses the EAB-QA-Test project, schema "biz".
#   Repo VARIABLES SUPABASE_URL and SUPABASE_ANON_KEY (the publishable key, which is public by design and inside every
#   APK anyway) win over the older repo SECRETS of the same names, which still point to the paused Biz project.
#   Optional variable SUPABASE_SCHEMA (default biz; "public" for a stand-alone Biz project).

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  BATCH: j2  # bump per batch (d, e, …) so earlier batch links stay available

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: EAB-QA-Test biz schema file matches the migrations
        working-directory: .
        run: node supabase/eab-qa-test/make.mjs --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chatwoot bridge tests (no network)
        working-directory: .
        run: node --test --experimental-strip-types supabase/functions/chatwoot-bridge/tests/*.test.ts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.aibuddybiz --project-name ai_buddy_biz .

      - name: App name and permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="Ai buddy Biz"#' "$M"
          # Google sign-in: let the browser hand the login back to the app
          sed -i '0,/<\/activity>/s|</activity>|<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="aibuddybiz" android:host="login-callback"/></intent-filter>\n        </activity>|' "$M"
          # Let the app open phone, WhatsApp, email and web links (Android 11+ package visibility)
          INTENTS='    <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n    <intent><action android:name="android.intent.action.DIAL"/><data android:scheme="tel"/></intent>\n    <intent><action android:name="android.intent.action.SENDTO"/><data android:scheme="mailto"/></intent>'
          if grep -q '<queries>' "$M"; then
            sed -i "s#<queries>#<queries>\n$INTENTS#" "$M"
          else
            sed -i "s#</manifest>#  <queries>\n$INTENTS\n  </queries>\n</manifest>#" "$M"
          fi
          cat "$M"

      - run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        continue-on-error: true
        run: flutter test

      - name: Build APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SCHEMA: ${{ vars.SUPABASE_SCHEMA || 'biz' }}
          TRACK_URL: ${{ vars.TRACK_URL }}
          SIGN_URL: ${{ vars.SIGN_URL }}
        run: |
          set -o pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then echo "SUPABASE_URL / SUPABASE_ANON_KEY not set"; exit 1; fi
          echo "Database: $SUPABASE_URL schema $SUPABASE_SCHEMA"
          # The stand-alone Biz project (akabqdzqmqfevlmazyqo) was paused 7 Nov 2026 (D-7N-1/2). An APK built for it cannot
          # work, so it is built (to prove the code compiles) but not published.
          case "$SUPABASE_URL" in
            *akabqdzqmqfevlmazyqo*) echo "PUBLISH=no" >> "$GITHUB_ENV"
              echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY still point to the paused Biz project. Set them to EAB-QA-Test and run again." ;;
            *) echo "PUBLISH=yes" >> "$GITHUB_ENV" ;;
          esac
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SUPABASE_SCHEMA="$SUPABASE_SCHEMA" \
            --dart-define=TRACK_URL="$TRACK_URL" \
            --dart-define=SIGN_URL="$SIGN_URL" 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp build/app/outputs/flutter-apk/app-release.apk "ai-buddy-biz-batch-$BATCH.apk"

      - name: Save build log on failure
        if: failure()
        run: |
          cd "$RUNNER_TEMP"
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" logrepo
          cd logrepo
          git checkout --orphan build-logs
          git rm -rf . -q || true
          tail -n 300 "$RUNNER_TEMP/build.log" > build.log
          git add build.log
          git -c user.name=ci -c user.email=ci@example.com commit -qm "build log"
          git push -f origin build-logs

      - uses: actions/upload-artifact@v4
        with:
          name: ai-buddy-biz-batch-${{ env.BATCH }}
          path: app/ai-buddy-biz-batch-${{ env.BATCH }}.apk

      - name: Publish to batch release
        if: env.PUBLISH == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: batch-${{ env.BATCH }}
          name: Ai buddy Biz — Batch ${{ env.BATCH }}
          prerelease: true
          files: app/ai-buddy-biz-batch-${{ env.BATCH }}.apk
          body: |
            Test build for Batch ${{ env.BATCH }}. Install on Android (allow "install unknown apps").
            Test checklist: Dropbox /Ai buddy Biz/Batch ${{ env.BATCH }}/
