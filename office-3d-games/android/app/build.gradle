plugins { id 'com.android.application' }
android {
  namespace 'com.jsl.office3d'
  compileSdk 34
  defaultConfig {
    applicationId "com.jsl.office3d"
    minSdk 24
    targetSdk 34
    versionCode 1
    versionName "1.0"
  }
  flavorDimensions "game"
  productFlavors {
    opus {
      dimension "game"
      applicationIdSuffix ".opus"
      resValue "string", "app_name", "NovaCorp HQ"
      buildConfigField "String", "START", "\"site/opus/index.html\""
    }
    fable {
      dimension "game"
      applicationIdSuffix ".fable"
      resValue "string", "app_name", "Fable Dynamics HQ"
      buildConfigField "String", "START", "\"site/fable/index.html\""
    }
  }
  buildFeatures { buildConfig true }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
